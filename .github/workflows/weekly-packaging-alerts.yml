name: 📦 Alertas Semanais de Embalagens

on:
  schedule:
    - cron: '47 7 * * 1'   # Todas as segundas-feiras às 07:47 UTC
  workflow_dispatch:         # Permite disparar manualmente pelo GitHub UI

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Instalar requests
        run: pip install requests --quiet

      - name: Enviar alertas de embalagens
        env:
          SUPABASE_URL: https://cngnoirjlpfpipbmlens.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, sys, requests
          from datetime import datetime, timezone

          SUPABASE_URL    = os.environ["SUPABASE_URL"]
          SUPABASE_KEY    = os.environ["SUPABASE_ANON_KEY"]
          BREVO_KEY       = os.environ["BREVO_API_KEY"]
          DESTINATARIO    = "qualidade@tipiedade.com"
          NOME_DEST       = "Milene"
          REMETENTE_EMAIL = "sales@tipiedade.com"
          REMETENTE_NOME  = "Ti'Piedade Qualidade"

          # ── Consumo 2025 (base de cálculo) ──────────────────────────
          CONSUMO_2025 = {
              "EMB001": {"nome": "Caixa Original 500gr",    "q2025": 196134},
              "EMB002": {"nome": "Caixa Original 250gr",    "q2025": 124892},
              "EMB003": {"nome": "Caixa Luxo 500gr",        "q2025":  45231},
              "EMB004": {"nome": "Caixa Mini 100gr",        "q2025":  38764},
              "EMB005": {"nome": "Caixa Presente 2un",      "q2025":  22108},
              "EMB006": {"nome": "Base Cartão 500gr",       "q2025": 201456},
              "EMB007": {"nome": "Base Cartão 250gr",       "q2025": 128934},
              "EMB008": {"nome": "Papel Vegetal Folha",     "q2025": 312000},
              "EMB009": {"nome": "Papel Seda Branco",       "q2025":  45600},
              "EMB010": {"nome": "Fita Dourada 10mm",       "q2025":   8920},
              "EMB011": {"nome": "Etiqueta Oval Premium",   "q2025": 198234},
              "EMB012": {"nome": "Etiqueta Redonda Mini",   "q2025":  87650},
              "EMB013": {"nome": "Etiqueta Ingredientes A", "q2025": 145230},
              "EMB014": {"nome": "Saco Celofane 15x25",     "q2025":  67840},
              "EMB015": {"nome": "Saco Celofane 20x30",     "q2025":  43210},
              "EMB016": {"nome": "Caixa Transporte G",      "q2025":  12340},
              "EMB017": {"nome": "Caixa Transporte M",      "q2025":  18920},
          }

          # ── 1. Consultar Supabase ────────────────────────────────────
          print("[1/3] A consultar Supabase...")
          resp = requests.get(
              f"{SUPABASE_URL}/rest/v1/packaging_stock",
              params={"select": "artigo,contagem,updated_at"},
              headers={"apikey": SUPABASE_KEY, "Authorization": f"Bearer {SUPABASE_KEY}"},
              timeout=30,
          )
          resp.raise_for_status()
          rows = resp.json()
          stock = {r["artigo"]: r for r in rows}
          print(f"   {len(rows)} artigos encontrados no stock.")

          # ── 2. Calcular riscos ───────────────────────────────────────
          criticos, alertas, atencoes, ok_items, sem_contagem = [], [], [], [], []

          for cod, d in CONSUMO_2025.items():
              row = stock.get(cod)
              contagem = row["contagem"] if row and row.get("contagem") is not None else None
              if contagem is None:
                  sem_contagem.append({"codigo": cod, "nome": d["nome"]})
                  continue
              if contagem == 0:
                  sem_contagem.append({"codigo": cod, "nome": d["nome"]})
                  continue
              proj2026 = round((d["q2025"] / 10) * 12)
              consumo_diario = proj2026 / 365
              dias = int(contagem / consumo_diario) if consumo_diario > 0 else 9999
              item = {"codigo": cod, "nome": d["nome"], "contagem": contagem,
                      "dias": dias, "proj2026": proj2026}
              if   dias < 30: item["estado"] = "CRÍTICO";  criticos.append(item)
              elif dias < 60: item["estado"] = "ALERTA";   alertas.append(item)
              elif dias < 90: item["estado"] = "ATENÇÃO";  atencoes.append(item)
              else:           item["estado"] = "OK";       ok_items.append(item)

          # ── 3. Construir email HTML ──────────────────────────────────
          print("[2/3] A construir email...")
          hoje = datetime.now(timezone.utc).strftime("%d/%m/%Y")

          def badge(estado):
              cores = {"CRÍTICO": ("#c0392b","#fff"), "ALERTA": ("#e67e22","#fff"),
                       "ATENÇÃO": ("#f1c40f","#333"), "OK": ("#27ae60","#fff")}
              bg, fg = cores.get(estado, ("#999","#fff"))
              return (f'<span style="background:{bg};color:{fg};padding:2px 8px;'
                      f'border-radius:4px;font-size:12px;font-weight:bold;">{estado}</span>')

          def tr(it):
              return (f'<tr><td style="padding:8px;border-bottom:1px solid #eee;">{it["codigo"]}</td>'
                      f'<td style="padding:8px;border-bottom:1px solid #eee;">{it["nome"]}</td>'
                      f'<td style="padding:8px;border-bottom:1px solid #eee;text-align:right;">{it["contagem"]:,}</td>'
                      f'<td style="padding:8px;border-bottom:1px solid #eee;text-align:right;"><strong>{it["dias"]}</strong></td>'
                      f'<td style="padding:8px;border-bottom:1px solid #eee;text-align:center;">{badge(it["estado"])}</td></tr>')

          urgentes = criticos + alertas
          if urgentes:
              linhas = "".join(tr(i) for i in urgentes + atencoes)
              tabela = (f'<table style="width:100%;border-collapse:collapse;font-size:14px;">'
                        f'<thead><tr style="background:#f5f5f5;">'
                        f'<th style="padding:10px;text-align:left;border-bottom:2px solid #ddd;">Código</th>'
                        f'<th style="padding:10px;text-align:left;border-bottom:2px solid #ddd;">Artigo</th>'
                        f'<th style="padding:10px;text-align:right;border-bottom:2px solid #ddd;">Stock</th>'
                        f'<th style="padding:10px;text-align:right;border-bottom:2px solid #ddd;">Dias</th>'
                        f'<th style="padding:10px;text-align:center;border-bottom:2px solid #ddd;">Estado</th>'
                        f'</tr></thead><tbody>{linhas}</tbody></table>')
              resumo_txt = (f"⚠️ {len(criticos)} artigo(s) CRÍTICO(s)"
                            f" e {len(alertas)} em ALERTA — lead time 45 dias.")
          else:
              tabela = '<p style="color:#27ae60;font-size:16px;font-weight:bold;">✅ Tudo OK esta semana — sem artigos em risco.</p>'
              resumo_txt = "✅ Sem artigos em risco esta semana."

          if sem_contagem:
              sc = "".join(f"<li>{s['codigo']} — {s['nome']}</li>" for s in sem_contagem)
              bloco_sc = (f'<div style="margin-top:24px;padding:16px;background:#fff9e6;'
                          f'border-left:4px solid #f1c40f;border-radius:4px;">'
                          f'<strong>⚠️ Artigos sem contagem ({len(sem_contagem)}):</strong>'
                          f'<ul style="margin:8px 0 0 0;">{sc}</ul>'
                          f'<p style="margin:8px 0 0 0;font-size:12px;color:#666;">'
                          f'Precisam de ser contados no inventário.</p></div>')
          else:
              bloco_sc = ""

          html = f"""<!DOCTYPE html><html><head><meta charset=\"utf-8\"></head>
          <body style=\"font-family:Arial,sans-serif;color:#333;max-width:680px;margin:0 auto;padding:24px;\">
          <div style=\"background:#2c3e50;color:#fff;padding:20px 24px;border-radius:8px 8px 0 0;\">
            <h1 style=\"margin:0;font-size:20px;\">📦 Alertas de Embalagens</h1>
            <p style=\"margin:4px 0 0;font-size:14px;opacity:0.8;\">{hoje} · Pão de Ló Ti'Piedade</p>
          </div>
          <div style=\"border:1px solid #ddd;border-top:none;padding:24px;border-radius:0 0 8px 8px;\">
            <p style=\"font-size:15px;color:#555;\">Olá Milene,</p>
            <p style=\"font-size:15px;color:#555;margin-bottom:20px;\">{resumo_txt}</p>
            {tabela}
            {bloco_sc}
            <div style=\"margin-top:28px;padding:14px;background:#f0f4ff;border-radius:6px;font-size:13px;color:#555;\">
              🔗 Atualizar contagens:<br>
              <a href=\"https://tipiedade.github.io/inventario-factory\" style=\"color:#2c6fad;\">
                https://tipiedade.github.io/inventario-factory</a> (aba Embalagens)
            </div>
            <p style=\"margin-top:24px;font-size:12px;color:#999;\">Relatório automático · {hoje} · Ti'Piedade</p>
          </div></body></html>"""

          # ── 4. Enviar via Brevo ──────────────────────────────────────
          print("[3/3] A enviar email via Brevo...")
          r = requests.post(
              "https://api.brevo.com/v3/smtp/email",
              headers={"api-key": BREVO_KEY, "Content-Type": "application/json"},
              json={
                  "sender":      {"name": REMETENTE_NOME, "email": REMETENTE_EMAIL, "id": 1},
                  "to":          [{"email": DESTINATARIO, "name": NOME_DEST}],
                  "subject":     f"📦 Alertas de Embalagens — {hoje} | Ti'Piedade",
                  "htmlContent": html,
              },
              timeout=30,
          )
          r.raise_for_status()
          msg_id = r.json().get("messageId", "N/A")
          print(f"   ✅ Email enviado! messageId: {msg_id}")
          print(f"   Críticos : {len(criticos)}")
          print(f"   Alertas  : {len(alertas)}")
          print(f"   Atenção  : {len(atencoes)}")
          print(f"   OK       : {len(ok_items)}")
          print(f"   Sem count: {len(sem_contagem)}")
          PYEOF
