name: Manter Supabase ativo

on:
  schedule:
    # Todos os dias às 06:00 UTC (~07:00/08:00 em Portugal, dependendo da hora de verão)
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Permite correr manualmente em GitHub > Actions > "Manter Supabase ativo" > Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedido à base de dados (evita pausa por inatividade)
        run: |
          curl -s -o /dev/null -w "Estado HTTP: %{http_code}\n" \
            "https://cngnoirjlpfpipbmlens.supabase.co/rest/v1/locations?select=id&limit=1" \
            -H "apikey: sb_publishable_qO1UjfG_RDNFTz2G6LM9rA_qpk6zHVx" \
            -H "Authorization: Bearer sb_publishable_qO1UjfG_RDNFTz2G6LM9rA_qpk6zHVx"
