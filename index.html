<style>
:root{
 --brown:#493631;--brown-dark:#332521;--brown-light:#8C6F58;
 --cream:#F8F3EA;--cream-card:#FFFFFF;--tan:#EFE6D8;
 --ink:#332521;--muted:#8A796E;--success:#5E7A54;--danger:#A8493B;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--cream);color:var(--ink)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif}
header{background:var(--cream-card);border-bottom:1px solid var(--tan);padding:14px 24px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px}
header img{height:46px;width:auto}
header .brand-text{line-height:1.15}
header .brand-text b{font-family:'Playfair Display',serif;font-size:19px;color:var(--brown)}
header .brand-text small{color:var(--brown-light);letter-spacing:.04em}
.container{max-width:1250px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:600;font-family:'Inter',sans-serif;transition:filter .15s}
button:hover{filter:brightness(0.94)}
.primary{background:var(--brown);color:#fff}.success{background:var(--success);color:#fff}.secondary{background:var(--tan);color:var(--brown)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card,.panel,.kpi{background:var(--cream-card);border:1px solid var(--tan);border-radius:12px;padding:20px}.card{cursor:pointer}.card:hover{box-shadow:0 5px 18px rgba(73,54,49,.12);border-color:var(--brown-light)}
.card h3{margin:0 0 6px;color:var(--brown);font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}.kpi b{display:block;font-size:28px;margin-top:5px;color:var(--brown);font-family:'Playfair Display',serif}
.progress{height:8px;background:var(--tan);border-radius:10px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:var(--success)}
.search{width:100%;padding:14px;border:1px solid var(--tan);border-radius:8px;font-size:16px;margin:15px 0;background:var(--cream-card)}
table{width:100%;border-collapse:collapse}th{background:var(--tan);color:var(--brown);text-align:left;padding:12px;font-size:13px}td{padding:10px 12px;border-top:1px solid var(--tan)}
.quantity{width:110px;padding:11px;border:1px solid var(--brown-light);border-radius:7px;font-size:18px;text-align:right}.muted{color:var(--muted)}.empty{text-align:center;padding:40px;color:var(--muted)}
.status{padding:8px 12px;border-radius:20px;background:var(--tan);color:var(--brown);font-size:13px}.error{background:#F7E4E1;color:var(--danger);padding:15px;border-radius:8px;margin-bottom:15px}
.history{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px;border-top:1px solid var(--tan)}.history:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:700px){.container{padding:12px}.history{flex-direction:column;align-items:flex-start}th:nth-child(2),td:nth-child(2){display:none}}
.login-box{max-width:340px;margin:60px auto;background:var(--cream-card);border:1px solid var(--tan);border-radius:14px;padding:32px;text-align:center;box-shadow:0 10px 30px rgba(73,54,49,.08)}
.login-box img{height:64px;margin-bottom:6px}
.login-box h2{margin:6px 0 4px;color:var(--brown)}
.login-box select,.login-box input{width:100%;padding:13px;border:1px solid var(--tan);border-radius:8px;font-size:17px;margin-bottom:12px;text-align:center;font-family:'Inter',sans-serif}
.login-box button{width:100%;padding:13px;font-size:16px}
.op-badge{display:flex;align-items:center;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brown-dark);color:#fff;padding:14px 22px;border-radius:10px;font-size:15px;max-width:90%;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.error{background:var(--danger)}
</style>

async function doLogin(){
 const name=document.getElementById("loginOp").value,pin=document.getElementById("loginPin").value;
 if(!name){renderLogin("Escolhe o teu nome.");return}
 if(!pin||pin.length<6){renderLogin("O PIN tem de ter pelo menos 6 dígitos.");return}
 const email=OPERATORS[name];
 loading("A entrar...");
 const{data,error}=await db.auth.signInWithPassword({email,password:pin});
 if(error){renderLogin("PIN incorreto para "+name+".");return}
 currentOperator=name;currentOperatorId=data.user.id;
 loadDashboard();
}

async function doLogout(){
 await db.auth.signOut();currentOperator="";currentOperatorId="";renderLogin();
}

async function boot(){
 const{data}=await db.auth.getSession();
 if(!data.session){renderLogin();return}
 const email=data.session.user.email;
 const name=Object.keys(OPERATORS).find(n=>OPERATORS[n]===email);
 if(!name){await db.auth.signOut();renderLogin();return}
 currentOperator=name;currentOperatorId=data.session.user.id;
 loadDashboard();
}

function nav(){return '<div class="nav"><button id="dashboard" class="secondary">🏠 Dashboard</button><button id="history" class="secondary">🕘 Histórico</button><button id="stock" class="secondary">📊 Stock</button><button id="compare" class="secondary">↔ Comparar</button><button id="manage" class="secondary">⚙️ Artigos/Armazéns</button></div>'}
function bindNav(){document.getElementById("dashboard")?.addEventListener("click",loadDashboard);document.getElementById("history")?.addEventListener("click",showHistory);document.getElementById("stock")?.addEventListener("click",showStock);document.getElementById("compare")?.addEventListener("click",showCompare);document.getElementById("manage")?.addEventListener("click",showManage)}
function loading(t){app.innerHTML='<div class="panel empty">'+esc(t)+'</div>'}
function toast(msg,isError){
 document.querySelectorAll(".toast").forEach(t=>t.remove());
 const el=document.createElement("div");el.className="toast"+(isError?" error":"");el.textContent=msg;
 document.body.appendChild(el);
 setTimeout(()=>el.remove(),isError?6000:3500);
}
function showError(e){app.innerHTML=nav()+'<div class="error"><b>Erro:</b><br>'+esc(e?.message||e)+'</div>';bindNav()}

async function loadBase(){
 const l=await db.from("locations").select("*").order("name");
 const p=await db.from("products").select("*").order("code");
 const i=await db.from("inventories").select("*").order("created_at",{ascending:false});
 if(l.error)throw l.error;if(p.error)throw p.error;if(i.error)throw i.error;
 locations=l.data||[];products=p.data||[];inventories=i.data||[];
}
const activeProducts=()=>products.filter(p=>p.active!==false);
const activeLocations=()=>locations.filter(l=>l.active!==false);

async function loadDashboard(){
 loading("A carregar inventário...");
 try{await loadBase();renderDashboard()}catch(e){showError(e)}
}

function renderDashboard(){
 const inv=inventories[0],aLoc=activeLocations(),aProd=activeProducts();
 app.innerHTML=nav()+'<div class="topbar"><div><h2>Inventário atual</h2><small>'+aProd.length+' artigos · '+aLoc.length+' armazéns</small></div><div class="actions op-badge"><span class="status">👤 '+esc(currentOperator)+'</span><span class="status">'+(inv?(inv.name?esc(inv.name):"Inventário de "+d(inv.created_at))+(inv.status==="fechado"?" 🔒":""):"Sem inventário")+'</span>'+(inv&&inv.status==="fechado"?'<button id="reopenBtn" class="secondary">🔓 Reabrir</button>':'')+'<button id="newInvBtn" class="primary">➕ Novo inventário</button><button id="logoutBtn" class="secondary">Sair</button></div></div>'+
 '<div class="kpis"><div class="kpi">Artigos<b>'+aProd.length+'</b></div><div class="kpi">Armazéns<b>'+aLoc.length+'</b></div><div class="kpi">Inventários<b>'+inventories.length+'</b></div><div class="kpi">Valor de stock<b id="stockValue">—</b></div></div>'+
 (aLoc.length?'<div class="cards">'+aLoc.map(l=>'<div class="card loc-card" data-loc="'+esc(l.id)+'"><h3>'+esc(l.name)+'</h3><p>'+aProd.length+' artigos</p><p class="muted">'+(inv?.status?esc(inv.status):"aberto")+'</p><div class="progress"><div id="bar-'+esc(l.id)+'" style="width:0%"></div></div><p><b id="count-'+esc(l.id)+'">0</b> contados</p></div>').join("")+'</div>':'<div class="panel empty">Sem armazéns ativos. Cria um em Artigos/Armazéns.</div>');
 bindNav();
 document.getElementById("logoutBtn")?.addEventListener("click",doLogout);
 document.getElementById("newInvBtn")?.addEventListener("click",createNewInventory);
 document.getElementById("reopenBtn")?.addEventListener("click",()=>reopenInventory(inv.id,"dashboard"));
 document.querySelectorAll(".loc-card").forEach(x=>x.addEventListener("click",()=>openLocation(x.dataset.loc,inv?.id)));
 if(inv)loadProgress(inv.id);
}

async function createNewInventory(){
 const suggested=new Date().toLocaleDateString("pt-PT",{month:"long",year:"numeric"});
 const label=suggested.charAt(0).toUpperCase()+suggested.slice(1);
 const name=prompt("Nome do novo inventário:",label);
 if(!name)return;
 try{
  const r=await db.from("inventories").insert({status:"aberto",name}).select();
  if(r.error)throw r.error;

 const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)
}

async function getComparisonRows(oldId,newId){
 const [oldRows,newRows]=await Promise.all([getRows(oldId),getRows(newId)]);
 const makeMap=rows=>{const m={};rows.forEach(r=>{const k=String(r.Codigo)+"|"+r.Armazem;m[k]=r});return m};
 const a=makeMap(oldRows),b=makeMap(newRows),keys=new Set([...Object.keys(a),...Object.keys(b)]);
 const out=[];
 keys.forEach(k=>{
  const x=a[k]||{},y=b[k]||{};
  const oldQ=Number(x.Quantidade||0),newQ=Number(y.Quantidade||0),diff=newQ-oldQ;
  const pct=oldQ!==0?(diff/oldQ)*100:null;
  const custo=y.CustoUnit||x.CustoUnit||0;
  out.push({Codigo:y.Codigo??x.Codigo,Artigo:y.Artigo||x.Artigo,Armazem:y.Armazem||x.Armazem,Anterior:oldQ,Atual:newQ,Diferenca:diff,VariacaoPct:pct,ValorDiferenca:diff*custo});
 });
 return out.sort((x,y)=>String(x.Codigo).localeCompare(String(y.Codigo),undefined,{numeric:true})||String(x.Armazem).localeCompare(String(y.Armazem)));
}

}

 const cost_price=value===""?null:Number(value);
 try{const r=await db.from("products").update({cost_price}).eq("id",id);if(r.error)throw r.error;await loadBase();toast("💰 Custo atualizado.")}
 catch(e){console.error(e);toast("Erro ao atualizar custo: "+e.message,true)}
}

function bindToggles(){
 document.querySelectorAll(".toggle-loc").forEach(b=>b.addEventListener("click",()=>toggleActive("locations",b.dataset.id,b.dataset.active==="true")));
 document.querySelectorAll(".toggle-prod").forEach(b=>b.addEventListener("click",()=>toggleActive("products",b.dataset.id,b.dataset.active==="true")));
}

async function toggleActive(table,id,isActive){
 try{
  const r=await db.from(table).update({active:!isActive}).eq("id",id);
  if(r.error)throw r.error;
  await loadBase();renderManage();
 }catch(e){alert("Erro: "+e.message)}
}

async function addLocation(){
 const name=document.getElementById("newLocName").value.trim();
 if(!name)return;
 try{const r=await db.from("locations").insert({name,active:true});if(r.error)throw r.error;await loadBase();renderManage()}
 catch(e){alert("Erro ao adicionar armazém: "+e.message)}
}

async function addProduct(){
 const code=document.getElementById("newProdCode").value.trim(),description=document.getElementById("newProdDesc").value.trim(),unit=document.getElementById("newProdUnit").value.trim(),costVal=document.getElementById("newProdCost").value;
 if(!code||!description){alert("Código e descrição são obrigatórios.");return}
 const cost_price=costVal===""?null:Number(costVal);
 try{const r=await db.from("products").insert({code,description,unit,active:true,cost_price});if(r.error)throw r.error;await loadBase();renderManage()}
 catch(e){alert("Erro ao adicionar artigo: "+e.message)}
}

boot();
</script>
</body>
