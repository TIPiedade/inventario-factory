<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário Fábrica</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 18px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header small {
      color: #6b7280;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #1f6feb;
      color: white;
    }

    .btn-secondary {
      background: #e9edf2;
      color: #17202a;
    }

    .btn-success {
      background: #198754;
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid #e1e5e9;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: .15s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .card h3 {
      margin: 0 0 8px;
    }

    .card p {
      margin: 4px 0;
      color: #667085;
    }

    .progress {
      height: 8px;
      background: #e9ecef;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress div {
      height: 100%;
      background: #198754;
    }

    .panel {
      background: white;
      border-radius: 12px;
      border: 1px solid #e1e5e9;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd2d8;
      border-radius: 8px;
      font-size: 16px;
      margin: 15px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f1f3f5;
      text-align: left;
      padding: 12px;
      font-size: 13px;
    }

    td {
      padding: 10px 12px;
      border-top: 1px solid #eee;
    }

    .quantity {
      width: 110px;
      padding: 11px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 18px;
      text-align: right;
    }

    .last-count {
      font-weight: bold;
      color: #495057;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    .status {
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      background: #e9f7ef;
      color: #198754;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .success {
      background: #ecfdf3;
      color: #027a48;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 12px;
      }

      table {
        font-size: 13px;
      }

      th:nth-child(2),
      td:nth-child(2) {
        display: none;
      }

      .quantity {
        width: 90px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Inventário Fábrica</h1>
  <small>Contagem física mensal</small>
</header>

<div class="container">

  <div id="app"></div>

</div>

<script>

const SUPABASE_URL = "https://cngnoirjlpfpipbmlens.supabase.co";

/*
  IMPORTANTE:
  Substitui o texto abaixo pela tua publishable key do Supabase.
*/
const SUPABASE_KEY = "sb_publishable_qO1UjfG_RDNFTz2G6LM9rA_qpk6zHVx";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let locations = [];
let products = [];
let currentLocation = null;
let currentInventory = null;
let lastCounts = {};
let currentCounts = {};

function showLoading(text = "A carregar...") {
  document.getElementById("app").innerHTML = `
    <div class="panel empty">${text}</div>
  `;
}

function showError(message) {
  document.getElementById("app").innerHTML = `
    <div class="error">
      <strong>Erro</strong><br>
      ${message}
    </div>
    <button class="btn-secondary" onclick="loadDashboard()">
      Tentar novamente
    </button>
  `;
}

async function loadDashboard() {

  showLoading("A carregar inventário...");

  try {

    const { data: locs, error: locError } =
      await db
        .from("locations")
        .select("*")
        .order("name");

    if (locError) throw locError;

    const { data: prods, error: prodError } =
      await db
        .from("products")
        .select("*")
        .eq("active", true)
        .order("code");

    if (prodError) throw prodError;

    locations = locs || [];
    products = prods || [];

    renderDashboard();

  } catch (error) {

    console.error(error);

    showError(
      "Não foi possível ligar à base de dados.<br><br>" +
      error.message
    );
  }
}

function renderDashboard() {

  const total = locations.length;

  document.getElementById("app").innerHTML = `

    <div class="topbar">
      <div>
        <h2>Inventário atual</h2>
        <small>
          ${products.length} artigos · ${total} armazéns
        </small>
      </div>

      <span class="status">
        Inventário mensal
      </span>
    </div>

    <div class="cards">

      ${locations.map(location => `

        <div class="card"
             onclick="openLocation(${location.id})">

          <h3>${escapeHtml(location.name)}</h3>

          <p>
            ${products.length} artigos
          </p>

          <div class="progress">
            <div style="width:0%"></div>
          </div>

          <p style="margin-top:10px">
            <strong>0</strong> contados
          </p>

        </div>

      `).join("")}

    </div>
  `;
}

async function openLocation(locationId) {

  currentLocation =
    locations.find(x => x.id === locationId);

  if (!currentLocation) return;

  showLoading(
    `A carregar ${currentLocation.name}...`
  );

  try {

    /*
      Procuramos o inventário mais recente.
    */

    const { data: inventories, error } =
      await db
        .from("inventories")
        .select("*")
        .order("created_at", {
          ascending: false
        })
        .limit(1);

    if (error) throw error;

    currentInventory =
      inventories && inventories.length
        ? inventories[0]
        : null;

    await loadLastCounts();

    renderLocation();

  } catch (error) {

    console.error(error);

    showError(error.message);
  }
}

async function loadLastCounts() {

  lastCounts = {};
  currentCounts = {};

  if (!currentInventory) return;

  /*
    Obtém as contagens deste inventário
    para o armazém selecionado.
  */

  const { data, error } =
    await db
      .from("counts")
      .select("*")
      .eq("inventory_id", currentInventory.id)
      .eq("location_id", currentLocation.id);

  if (error) throw error;

  (data || []).forEach(row => {

    currentCounts[row.product_code] =
      row.quantity;

  });

  /*
    Procuramos o inventário anterior.
  */

  const { data: previousInventories, error: prevError } =
    await db
      .from("inventories")
      .select("*")
      .lt("created_at", currentInventory.created_at)
      .order("created_at", {
        ascending: false
      })
      .limit(1);

  if (prevError) throw prevError;

  if (!previousInventories ||
      !previousInventories.length) return;

  const previous =
    previousInventories[0];

  const { data: previousCounts, error: countError } =
    await db
      .from("counts")
      .select("*")
      .eq("inventory_id", previous.id)
      .eq("location_id", currentLocation.id);

  if (countError) throw countError;

  (previousCounts || []).forEach(row => {

    lastCounts[row.product_code] =
      row.quantity;

  });
}

function renderLocation() {

  document.getElementById("app").innerHTML = `

    <div class="topbar">

      <div>
        <button
          class="btn-secondary"
          onclick="loadDashboard()">
          ← Armazéns
        </button>

        <h2 style="margin-top:15px">
          ${escapeHtml(currentLocation.name)}
        </h2>

        <small>
          ${products.length} artigos
        </small>
      </div>

      <button
        class="btn-success"
        onclick="saveAllCounts()">
        Guardar contagem
      </button>

    </div>

    <div class="panel">

      <input
        id="search"
        class="search"
        type="text"
        placeholder="Pesquisar por código ou artigo..."
        oninput="filterProducts()">

      <div id="productTable"></div>

    </div>
  `;

  renderProducts(products);
}

function renderProducts(list) {

  const container =
    document.getElementById("productTable");

  if (!list.length) {

    container.innerHTML =
      `<div class="empty">Nenhum artigo encontrado.</div>`;

    return;
  }

  container.innerHTML = `

    <table>

      <thead>

        <tr>
          <th>Código</th>
          <th>Artigo</th>
          <th>Última contagem</th>
          <th>Nova contagem</th>
        </tr>

      </thead>

      <tbody>

        ${list.map(product => {

          const last =
            lastCounts[product.code];

          const current =
            currentCounts[product.code];

          return `

            <tr>

              <td>
                <strong>${product.code}</strong>
              </td>

              <td>
                ${escapeHtml(product.description)}
              </td>

              <td class="last-count">
                ${last !== undefined
                  ? formatNumber(last)
                  : "—"}
              </td>

              <td>

                <input
                  class="quantity"
                  type="number"
                  min="0"
                  step="0.001"
                  value="${current !== undefined
                    ? current
                    : ""}"
                  data-product="${product.code}"
                  onchange="updateCount(
                    ${product.code},
                    this.value
                  )">

              </td>

            </tr>

          `;

        }).join("")}

      </tbody>

    </table>
  `;
}

function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(product => {

      return String(product.code)
        .toLowerCase()
        .includes(search)
        ||
        String(product.description)
          .toLowerCase()
          .includes(search);

    });

  renderProducts(filtered);
}

function updateCount(code, value) {

  if (value === "") {

    delete currentCounts[code];

    return;
  }

  const number =
    Number(value);

  if (Number.isNaN(number) || number < 0) return;

  currentCounts[code] = number;
}

async function saveAllCounts() {

  if (!currentInventory) {

    alert(
      "Ainda não existe um inventário aberto."
    );

    return;
  }

  const entries =
    Object.entries(currentCounts);

  if (!entries.length) {

    alert(
      "Não introduziste nenhuma contagem."
    );

    return;
  }

  if (!confirm(
    `Guardar ${entries.length} contagens no ${currentLocation.name}?`
  )) return;

  try {

    const rows = entries.map(
      ([code, quantity]) => ({

        inventory_id:
          currentInventory.id,

        location_id:
          currentLocation.id,

        product_code:
          Number(code),

        quantity:
          Number(quantity),

        counted_at:
          new Date().toISOString()

      })
    );

    const { error } =
      await db
        .from("counts")
        .upsert(
          rows,
          {
            onConflict:
              "inventory_id,location_id,product_code"
          }
        );

    if (error) throw error;

    alert(
      "Contagem guardada com sucesso."
    );

    await openLocation(
      currentLocation.id
    );

  } catch (error) {

    console.error(error);

    alert(
      "Erro ao guardar: " +
      error.message
    );
  }
}

function formatNumber(number) {

  return Number(number)
    .toLocaleString(
      "pt-PT",
      {
        maximumFractionDigits: 3
      }
    );
}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* Iniciar aplicação */

loadDashboard();

</script>

</body>
</html>
