<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventário Fábrica</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#fff;border-bottom:1px solid #ddd;padding:18px 24px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:24px}header small{color:#667085}
.container{max-width:1250px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:600}.primary{background:#1f6feb;color:#fff}.success{background:#198754;color:#fff}.secondary{background:#e9edf2;color:#17202a}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card,.panel,.kpi{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:20px}.card{cursor:pointer}.card:hover{box-shadow:0 5px 18px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}.kpi b{display:block;font-size:28px;margin-top:5px}
.progress{height:8px;background:#e9ecef;border-radius:10px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:#198754}
.search{width:100%;padding:14px;border:1px solid #ccd2d8;border-radius:8px;font-size:16px;margin:15px 0}
table{width:100%;border-collapse:collapse}th{background:#f1f3f5;text-align:left;padding:12px;font-size:13px}td{padding:10px 12px;border-top:1px solid #eee}
.quantity{width:110px;padding:11px;border:1px solid #bbb;border-radius:7px;font-size:18px;text-align:right}.muted{color:#667085}.empty{text-align:center;padding:40px;color:#777}
.status{padding:8px 12px;border-radius:20px;background:#e9f7ef;color:#198754;font-size:13px}.error{background:#fff0f0;color:#b42318;padding:15px;border-radius:8px;margin-bottom:15px}
.history{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px;border-top:1px solid #eee}.history:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:700px){.container{padding:12px}.history{flex-direction:column;align-items:flex-start}th:nth-child(2),td:nth-child(2){display:none}}
.login-box{max-width:340px;margin:60px auto;background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:28px;text-align:center}
.login-box h2{margin-top:0}
.login-box select,.login-box input{width:100%;padding:13px;border:1px solid #ccd2d8;border-radius:8px;font-size:17px;margin-bottom:12px;text-align:center}
.login-box button{width:100%;padding:13px;font-size:16px}
.op-badge{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<header><h1>Inventário Fábrica</h1><small>Contagem física mensal</small></header>
<div class="container"><div id="app"></div></div>
<script>
const SUPABASE_URL="https://cngnoirjlpfpipbmlens.supabase.co";
const SUPABASE_KEY="sb_publishable_qO1UjfG_RDNFTz2G6LM9rA_qpk6zHVx";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let locations=[],products=[],inventories=[],currentInventory=null,currentLocation=null,lastCounts={},currentCounts={},reportRows=[];
let currentOperator="";
// Mapa operador -> email interno (a conta real fica no Supabase Auth; o operador só vê o nome + PIN)
const OPERATORS={"Beatriz":"beatriz@inventario-pltp.app","Inês":"ines@inventario-pltp.app","Rui":"rui@inventario-pltp.app","Milene":"milene@inventario-pltp.app"};

const app=document.getElementById("app");
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const fmt=n=>Number(n||0).toLocaleString("pt-PT",{maximumFractionDigits:3});
const d=v=>new Date(v).toLocaleDateString("pt-PT");
const dt=v=>new Date(v).toLocaleString("pt-PT",{dateStyle:"short",timeStyle:"short"});

function renderLogin(err){
 app.innerHTML='<div class="login-box"><h2>🔐 Inventário</h2><p class="muted">Seleciona o teu nome e introduz o PIN</p>'+
 (err?'<div class="error">'+esc(err)+'</div>':'')+
 '<select id="loginOp"><option value="">Selecionar operador</option>'+Object.keys(OPERATORS).map(n=>'<option>'+n+'</option>').join("")+'</select>'+
 '<input id="loginPin" type="password" inputmode="numeric" placeholder="PIN" maxlength="8">'+
 '<button id="loginBtn" class="primary">Entrar</button></div>';
 document.getElementById("loginBtn").addEventListener("click",doLogin);
 document.getElementById("loginPin").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
}

async function doLogin(){
 const name=document.getElementById("loginOp").value,pin=document.getElementById("loginPin").value;
 if(!name){renderLogin("Escolhe o teu nome.");return}
 if(!pin||pin.length<6){renderLogin("O PIN tem de ter pelo menos 6 dígitos.");return}
 const email=OPERATORS[name];
 loading("A entrar...");
 const{error}=await db.auth.signInWithPassword({email,password:pin});
 if(error){renderLogin("PIN incorreto para "+name+".");return}
 currentOperator=name;
 loadDashboard();
}

async function doLogout(){
 await db.auth.signOut();currentOperator="";renderLogin();
}

async function boot(){
 const{data}=await db.auth.getSession();
 if(!data.session){renderLogin();return}
 const email=data.session.user.email;
 const name=Object.keys(OPERATORS).find(n=>OPERATORS[n]===email);
 if(!name){await db.auth.signOut();renderLogin();return}
 currentOperator=name;
 loadDashboard();
}

function nav(){return '<div class="nav"><button id="dashboard" class="secondary">🏠 Dashboard</button><button id="history" class="secondary">🕘 Histórico</button><button id="stock" class="secondary">📊 Stock</button><button id="compare" class="secondary">↔ Comparar</button></div>'}
function bindNav(){document.getElementById("dashboard")?.addEventListener("click",loadDashboard);document.getElementById("history")?.addEventListener("click",showHistory);document.getElementById("stock")?.addEventListener("click",showStock);document.getElementById("compare")?.addEventListener("click",showCompare)}
function loading(t){app.innerHTML='<div class="panel empty">'+esc(t)+'</div>'}
function showError(e){app.innerHTML=nav()+'<div class="error"><b>Erro:</b><br>'+esc(e?.message||e)+'</div>';bindNav()}

async function loadBase(){
 const l=await db.from("locations").select("*").order("name");
 const p=await db.from("products").select("*").order("code");
 const i=await db.from("inventories").select("*").order("created_at",{ascending:false});
 if(l.error)throw l.error;if(p.error)throw p.error;if(i.error)throw i.error;
 locations=l.data||[];products=p.data||[];inventories=i.data||[];
}

async function loadDashboard(){
 loading("A carregar inventário...");
 try{await loadBase();renderDashboard()}catch(e){showError(e)}
}

function renderDashboard(){
 const inv=inventories[0];
 app.innerHTML=nav()+'<div class="topbar"><div><h2>Inventário atual</h2><small>'+products.length+' artigos · '+locations.length+' armazéns</small></div><div class="actions op-badge"><span class="status">👤 '+esc(currentOperator)+'</span><span class="status">'+(inv?"Inventário de "+d(inv.created_at):"Sem inventário")+'</span><button id="logoutBtn" class="secondary">Sair</button></div></div>'+
 '<div class="kpis"><div class="kpi">Artigos<b>'+products.length+'</b></div><div class="kpi">Armazéns<b>'+locations.length+'</b></div><div class="kpi">Inventários<b>'+inventories.length+'</b></div></div>'+
 '<div class="cards">'+locations.map(l=>'<div class="card loc-card" data-loc="'+esc(l.id)+'"><h3>'+esc(l.name)+'</h3><p>'+products.length+' artigos</p><p class="muted">'+(inv?.status?esc(inv.status):"aberto")+'</p><div class="progress"><div id="bar-'+esc(l.id)+'" style="width:0%"></div></div><p><b id="count-'+esc(l.id)+'">0</b> contados</p></div>').join("")+'</div>';
 bindNav();
 document.getElementById("logoutBtn")?.addEventListener("click",doLogout);
 document.querySelectorAll(".loc-card").forEach(x=>x.addEventListener("click",()=>openLocation(x.dataset.loc,inv?.id)));
 if(inv)loadProgress(inv.id);
}

async function loadProgress(invId){
 const q=await db.from("counts").select("location_id,product_code").eq("inventory_id",invId);if(q.error)return;
 const m={};(q.data||[]).forEach(r=>{(m[String(r.location_id)]??=new Set()).add(String(r.product_code))});
 locations.forEach(l=>{let n=m[String(l.id)]?.size||0,p=products.length?Math.round(n/products.length*100):0;const c=document.getElementById("count-"+l.id),b=document.getElementById("bar-"+l.id);if(c)c.textContent=n;if(b)b.style.width=p+"%"})
}

async function openLocation(locId,invId){
 currentLocation=locations.find(x=>String(x.id)===String(locId));currentInventory=inventories.find(x=>String(x.id)===String(invId));
 if(!currentLocation||!currentInventory){alert("Armazém ou inventário não encontrado.");return}
 loading("A carregar "+currentLocation.name+"...");
 try{await loadCounts();renderLocation()}catch(e){showError(e)}
}

async function loadCounts(){
 currentCounts={};lastCounts={};
 let q=await db.from("counts").select("*").eq("inventory_id",currentInventory.id).eq("location_id",currentLocation.id);if(q.error)throw q.error;
 (q.data||[]).forEach(r=>currentCounts[String(r.product_code)]=r.quantity);
 const ix=inventories.findIndex(x=>String(x.id)===String(currentInventory.id)),prev=inventories[ix+1];
 if(prev){q=await db.from("counts").select("*").eq("inventory_id",prev.id).eq("location_id",currentLocation.id);if(q.error)throw q.error;(q.data||[]).forEach(r=>lastCounts[String(r.product_code)]=r.quantity)}
}

function renderLocation(){
 app.innerHTML=nav()+'<div class="topbar"><div><button id="back" class="secondary">← Armazéns</button><h2>'+esc(currentLocation.name)+'</h2><small>Inventário de '+d(currentInventory.created_at)+'</small></div><div class="actions"><button id="save" class="success">Guardar contagem</button><button id="closeInv" class="secondary">🔒 Fechar inventário</button></div></div><div class="panel"><input id="search" class="search" placeholder="Pesquisar por código ou artigo..."><div id="ptable"></div></div>';
 bindNav();document.getElementById("back").addEventListener("click",loadDashboard);document.getElementById("save").addEventListener("click",saveCounts);document.getElementById("closeInv").addEventListener("click",closeInventory);document.getElementById("search").addEventListener("input",filterProducts);renderProducts(products)
}

function renderProducts(list){
 document.getElementById("ptable").innerHTML='<table><thead><tr><th>Código</th><th>Artigo</th><th>Última contagem</th><th>Nova contagem</th></tr></thead><tbody>'+list.map(p=>{let k=String(p.code),c=currentCounts[k],l=lastCounts[k];return '<tr><td><b>'+esc(k)+'</b></td><td>'+esc(p.description)+'</td><td><b>'+(l===undefined?"—":fmt(l))+'</b></td><td><input class="quantity count-input" data-code="'+esc(k)+'" type="number" min="0" step="0.001" value="'+(c===undefined?"":c)+'"></td></tr>'}).join("")+'</tbody></table>';
 document.querySelectorAll(".count-input").forEach(i=>i.addEventListener("change",()=>{if(i.value==="")delete currentCounts[i.dataset.code];else currentCounts[i.dataset.code]=Number(i.value)}))
}
function filterProducts(){let s=document.getElementById("search").value.toLowerCase().trim();renderProducts(products.filter(p=>String(p.code).toLowerCase().includes(s)||String(p.description).toLowerCase().includes(s)))}

async function saveCounts(){
 if(currentInventory.status==="fechado"){alert("Este inventário está fechado e não pode ser alterado.");return;}
 const entries=Object.entries(currentCounts);if(!entries.length)return alert("Não introduziste nenhuma contagem.");
 if(!confirm("Guardar "+entries.length+" contagens no "+currentLocation.name+"?"))return;
 try{const rows=entries.map(([code,q])=>({inventory_id:currentInventory.id,location_id:currentLocation.id,product_code:Number(code),quantity:Number(q),counted_at:new Date().toISOString(),counted_by:currentOperator}));const r=await db.from("counts").upsert(rows,{onConflict:"inventory_id,location_id,product_code"});if(r.error)throw r.error;alert("Contagem guardada com sucesso.");await loadBase();openLocation(currentLocation.id,currentInventory.id)}catch(e){alert("Erro ao guardar: "+e.message)}
}


async function closeInventory(){
 if(!currentInventory)return;
 if(currentInventory.status==="fechado"){alert("Este inventário já está fechado.");return;}
 if(!confirm("Fechar este inventário? Depois de fechado, as contagens deixam de poder ser alteradas."))return;
 try{
  const r=await db.from("inventories").update({status:"fechado"}).eq("id",currentInventory.id);
  if(r.error)throw r.error;
  alert("Inventário fechado.");
  await loadBase(); currentInventory=inventories.find(x=>String(x.id)===String(currentInventory.id)); renderLocation();
 }catch(e){alert("Não foi possível fechar: "+e.message)}
}

async function showHistory(){
 loading("A carregar histórico...");
 try{await loadBase();app.innerHTML=nav()+'<div class="topbar"><div><h2>Histórico de inventários</h2><small>'+inventories.length+' inventário(s)</small></div></div><div class="panel">'+(inventories.length?inventories.map(i=>'<div class="history"><div><b>Inventário de '+d(i.created_at)+'</b><div class="muted">'+(i.status?('Estado: '+esc(i.status)+' · '):'')+'Criado em '+dt(i.created_at)+'</div></div><div class="actions"><button class="primary view-inv" data-id="'+esc(i.id)+'">Consultar / Editar</button><button class="success export-inv" data-id="'+esc(i.id)+'">Excel</button></div></div>').join(""):'<div class="empty">Não existem inventários.</div>')+'</div>';bindNav();
 document.querySelectorAll(".view-inv").forEach(b=>b.addEventListener("click",()=>viewInventory(b.dataset.id)));
 document.querySelectorAll(".export-inv").forEach(b=>b.addEventListener("click",()=>exportInventory(b.dataset.id)))
 }catch(e){showError(e)}
}

function viewInventory(id){
 currentInventory=inventories.find(x=>String(x.id)===String(id));if(!currentInventory)return alert("Inventário não encontrado.");
 app.innerHTML=nav()+'<div class="topbar"><div><button id="bh" class="secondary">← Histórico</button><h2>Inventário de '+d(currentInventory.created_at)+'</h2><small>Escolhe um armazém</small></div><button id="ex" class="success">📊 Exportar Excel</button></div><div class="cards">'+locations.map(l=>'<div class="card old-loc" data-loc="'+esc(l.id)+'"><h3>'+esc(l.name)+'</h3><p>Consultar / editar</p></div>').join("")+'</div>';
 bindNav();document.getElementById("bh").addEventListener("click",showHistory);document.getElementById("ex").addEventListener("click",()=>exportInventory(id));document.querySelectorAll(".old-loc").forEach(x=>x.addEventListener("click",()=>openLocation(x.dataset.loc,id)))
}

async function getRows(id){
 const q=await db.from("counts").select("*").eq("inventory_id",id);if(q.error)throw q.error;
 const lm=Object.fromEntries(locations.map(x=>[String(x.id),x.name])),pm=Object.fromEntries(products.map(x=>[String(x.code),x]));
 return (q.data||[]).map(r=>({Codigo:r.product_code,Artigo:pm[String(r.product_code)]?.description||"",Unidade:pm[String(r.product_code)]?.unit||"",Armazem:lm[String(r.location_id)]||String(r.location_id),Quantidade:Number(r.quantity),Data:r.counted_at?dt(r.counted_at):""}))
}

function csvDownload(rows,name){
 if(!rows.length)return alert("Não existem contagens para exportar.");
 const keys=Object.keys(rows[0]);const text=[keys,...rows.map(r=>keys.map(k=>String(r[k]??"").replaceAll('"','""')))].map(a=>a.map(v=>'"'+v+'"').join(";")).join("\r\n");
 const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)
}

async function exportInventory(id){
 try{
  const inv=inventories.find(x=>String(x.id)===String(id));if(!inv)throw new Error("Inventário não encontrado.");
  const rows=await getRows(id);if(!rows.length)return alert("Este inventário ainda não tem contagens.");
  const map={};rows.forEach(r=>{let k=String(r.Codigo);map[k]??={Codigo:r.Codigo,Artigo:r.Artigo,Unidade:r.Unidade};map[k][r.Armazem]=r.Quantidade});
  Object.values(map).forEach(r=>{locations.forEach(l=>{if(r[l.name]===undefined)r[l.name]=0});r.Total=locations.reduce((s,l)=>s+Number(r[l.name]||0),0)});
  const resumo=Object.values(map);
  if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(resumo),"Resumo");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Contagens");XLSX.writeFile(wb,"Inventario_"+d(inv.created_at).replaceAll("/","-")+".xlsx")}
  else{csvDownload(resumo,"Inventario_"+d(inv.created_at).replaceAll("/","-")+".csv");alert("O Excel não carregou. Foi descarregado um CSV que abre diretamente no Excel.")}
 }catch(e){alert("Erro ao exportar: "+e.message)}
}


async function getComparisonRows(oldId,newId){
 const [oldRows,newRows]=await Promise.all([getRows(oldId),getRows(newId)]);
 const makeMap=rows=>{const m={};rows.forEach(r=>{const k=String(r.Codigo)+"|"+r.Armazem;m[k]=r});return m};
 const a=makeMap(oldRows),b=makeMap(newRows),keys=new Set([...Object.keys(a),...Object.keys(b)]);
 const out=[];
 keys.forEach(k=>{
  const x=a[k]||{},y=b[k]||{};
  const oldQ=Number(x.Quantidade||0),newQ=Number(y.Quantidade||0),diff=newQ-oldQ;
  const pct=oldQ!==0?(diff/oldQ)*100:null;
  out.push({Codigo:y.Codigo??x.Codigo,Artigo:y.Artigo||x.Artigo,Armazem:y.Armazem||x.Armazem,Anterior:oldQ,Atual:newQ,Diferenca:diff,VariacaoPct:pct});
 });
 return out.sort((x,y)=>String(x.Codigo).localeCompare(String(y.Codigo),undefined,{numeric:true})||String(x.Armazem).localeCompare(String(y.Armazem)));
}

async function showCompare(){
 loading("A carregar comparação...");
 try{
  await loadBase();
  if(inventories.length<2){
   app.innerHTML=nav()+'<div class="panel empty"><h3>Ainda não existem dois inventários</h3><p>Para comparar meses precisas de ter pelo menos dois inventários gravados.</p></div>';
   bindNav();return;
  }
  app.innerHTML=nav()+`
  <div class="topbar"><div><h2>Comparar inventários</h2><small>Compara stock por artigo e armazém</small></div></div>
  <div class="panel">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
      <div><label><b>Inventário anterior</b></label><select id="oldInv" style="width:100%;padding:12px;margin-top:8px;border:1px solid #ccd2d8;border-radius:8px">${inventories.map((i,n)=>'<option value="'+esc(i.id)+'" '+(n===1?'selected':'')+'>Inventário de '+d(i.created_at)+'</option>').join("")}</select></div>
      <div><label><b>Inventário atual</b></label><select id="newInv" style="width:100%;padding:12px;margin-top:8px;border:1px solid #ccd2d8;border-radius:8px">${inventories.map((i,n)=>'<option value="'+esc(i.id)+'" '+(n===0?'selected':'')+'>Inventário de '+d(i.created_at)+'</option>').join("")}</select></div>
    </div>
    <button id="runCompare" class="primary" style="margin-top:18px">Comparar</button>
  </div>
  <div id="compareResult"></div>`;
  bindNav();document.getElementById("runCompare").addEventListener("click",runComparison);
  await runComparison();
 }catch(e){showError(e)}
}

async function runComparison(){
 const oldId=document.getElementById("oldInv").value,newId=document.getElementById("newInv").value;
 if(oldId===newId){document.getElementById("compareResult").innerHTML='<div class="error">Escolhe dois inventários diferentes.</div>';return}
 const box=document.getElementById("compareResult");box.innerHTML='<div class="panel empty">A calcular diferenças...</div>';
 try{
  const rows=await getComparisonRows(oldId,newId);
  const inc=rows.filter(r=>r.Diferenca>0).length,dec=rows.filter(r=>r.Diferenca<0).length,same=rows.filter(r=>r.Diferenca===0).length;
  window._comparisonRows=rows;
  box.innerHTML=`
   <div class="kpis">
    <div class="kpi">Linhas comparadas<b>${rows.length}</b></div>
    <div class="kpi">Aumentos<b>${inc}</b></div>
    <div class="kpi">Reduções<b>${dec}</b></div>
    <div class="kpi">Sem alteração<b>${same}</b></div>
   </div>
   <div class="panel">
    <div class="topbar"><h3 style="margin:0">Diferenças</h3><button id="exportCompare" class="success">📊 Exportar comparação</button></div>
    <input id="compareSearch" class="search" placeholder="Pesquisar código, artigo ou armazém...">
    <div id="compareTable"></div>
   </div>`;
  document.getElementById("exportCompare").addEventListener("click",()=>exportComparison(rows));
  document.getElementById("compareSearch").addEventListener("input",()=>filterComparison(rows));
  renderComparisonTable(rows);
 }catch(e){box.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

function renderComparisonTable(rows){
 document.getElementById("compareTable").innerHTML=`<table><thead><tr><th>Código</th><th>Artigo</th><th>Armazém</th><th>Anterior</th><th>Atual</th><th>Diferença</th><th>Variação</th></tr></thead><tbody>${
 rows.map(r=>'<tr><td><b>'+esc(r.Codigo)+'</b></td><td>'+esc(r.Artigo)+'</td><td>'+esc(r.Armazem)+'</td><td>'+fmt(r.Anterior)+'</td><td>'+fmt(r.Atual)+'</td><td><b>'+((r.Diferenca>0?"+":"")+fmt(r.Diferenca))+'</b></td><td>'+ (r.VariacaoPct===null?'—':r.VariacaoPct.toLocaleString("pt-PT",{maximumFractionDigits:1})+"%")+'</td></tr>').join("")
 }</tbody></table>`;
}

function filterComparison(rows){
 const q=document.getElementById("compareSearch").value.toLowerCase().trim();
 renderComparisonTable(rows.filter(r=>[r.Codigo,r.Artigo,r.Armazem].some(v=>String(v).toLowerCase().includes(q))));
}

function exportComparison(rows){
 if(!rows.length){alert("Não existem dados para exportar.");return}
 if(window.XLSX){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.map(r=>({...r,VariacaoPct:r.VariacaoPct===null?"":r.VariacaoPct}))),"Comparação");
  XLSX.writeFile(wb,"Comparacao_Inventarios.xlsx");
 }else{
  csvDownload(rows,"Comparacao_Inventarios.csv");
  alert("O Excel não carregou. Foi descarregado um CSV compatível com Excel.");
 }
}

async function showStock(){
 loading("A preparar stock...");
 try{await loadBase();if(!inventories.length){app.innerHTML=nav()+'<div class="panel empty">Ainda não existem inventários.</div>';bindNav();return}let rows=await getRows(inventories[0].id),m={};rows.forEach(r=>{let k=String(r.Codigo);m[k]??={Codigo:r.Codigo,Artigo:r.Artigo,Total:0};m[k].Total+=r.Quantidade});reportRows=Object.values(m);
 app.innerHTML=nav()+'<div class="topbar"><div><h2>Stock físico total</h2><small>Inventário de '+d(inventories[0].created_at)+'</small></div><button id="stockExport" class="success">📊 Exportar Excel</button></div><div class="panel"><input id="stockSearch" class="search" placeholder="Pesquisar artigo..."><div id="stockTable"></div></div>';bindNav();document.getElementById("stockExport").addEventListener("click",()=>exportInventory(inventories[0].id));document.getElementById("stockSearch").addEventListener("input",filterStock);renderStock(reportRows)
 }catch(e){showError(e)}
}
function renderStock(rows){document.getElementById("stockTable").innerHTML='<table><thead><tr><th>Código</th><th>Artigo</th><th>Stock físico total</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+esc(r.Codigo)+'</b></td><td>'+esc(r.Artigo)+'</td><td><b>'+fmt(r.Total)+'</b></td></tr>').join("")+'</tbody></table>'}
function filterStock(){let s=document.getElementById("stockSearch").value.toLowerCase().trim();renderStock(reportRows.filter(r=>String(r.Codigo).toLowerCase().includes(s)||String(r.Artigo).toLowerCase().includes(s)))}

boot();
</script>
</body>
